    <header class="max-w-4xl mx-auto px-4 pt-8 pb-6 text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2">The Noble Companions</h1>
        <p class="text-sm sm:text-base text-slate-600 dark:text-slate-400">The stars who illuminated the path of Islam alongside the Prophet (PBUH)</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-16">
        <div id="companions-container" class="space-y-6">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script>
        const companions = [
            {
                name: "Abu Bakr as-Siddiq (RA)",
                title: "As-Siddiq (The Truthful)",
                relation: "The First Caliph & Closest Companion",
                bio: "The closest companion and confidant of the Prophet (PBUH), known for his unwavering faith, generosity, and immediate belief in the Isra and Mi'raj.",
                legacy: "Steered the Muslim community through its most vulnerable hours after the passing of the Prophet."
            },
            {
                name: "Khadijah bint Khuwaylid (RA)",
                title: "Mother of the Believers",
                relation: "The First Wife & First Believer",
                bio: "A pillar of strength, wisdom, and financial support. She was the very first person to accept Islam and comforted the Prophet during the descent of the first revelation.",
                legacy: "Remembered eternally for her loyalty and supreme sacrifice during the earliest trials of Islam."
            },
            {
                name: "Umar ibn al-Khattab (RA)",
                title: "Al-Farooq (The Distinguisher)",
                relation: "The Second Caliph",
                bio: "Renowned for his immense courage, justice, and leadership. His conversion to Islam marked a turning point when Muslims could openly pray near the Kaaba.",
                legacy: "Expanded justice and administrative frameworks that laid the groundwork for the early Islamic state."
            },
            {
                name: "Ali ibn Abi Talib (RA)",
                title: "Asadullah (Lion of Allah)",
                relation: "The Fourth Caliph & Cousin",
                bio: "Raised in the household of the Prophet (PBUH), Ali was renowned for his unmatched bravery in battle, supreme eloquence, and profound depth of knowledge.",
                legacy: "Left behind an extraordinary treasury of judicial rulings, sermons, and wise sayings."
            },
            {
                name: "Bilal ibn Rabah (RA)",
                title: "Mu'adhin of the Prophet",
                relation: "First Caller to Prayer",
                bio: "An early Muslim slave who endured severe torture under his master Umayyah ibn Khalaf for refusing to renounce Islam, until he was purchased and freed by Abu Bakr.",
                legacy: "Chosen by the Prophet (PBUH) to deliver the very first call to prayer (Adhan) in Islam due to his deeply resonant and beautiful voice."
            }
        ];

        document.getElementById('companions-container').innerHTML = companions.map(c => `
            <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-800 pb-4">
                    <div>
                        <span class="text-xs font-semibold px-2.5 py-1 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 rounded-full">${c.relation}</span>
                        <h2 class="text-xl sm:text-2xl font-bold mt-2">${c.name}</h2>
                    </div>
                    <span class="text-sm font-medium text-amber-600 dark:text-amber-400 italic">${c.title}</span>
                </div>
                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">${c.bio}</p>
                <div class="bg-amber-50/60 dark:bg-slate-800/50 border border-amber-100 dark:border-slate-700/80 rounded-xl p-4">
                    <p class="text-xs font-bold uppercase tracking-wider text-amber-700 dark:text-amber-400 mb-1">Legacy</p>
                    <p class="text-sm text-slate-700 dark:text-slate-200">${c.legacy}</p>
                </div>
            </article>
        `).join('');
    </script>
