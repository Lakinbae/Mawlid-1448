        <p class="text-sm sm:text-base text-slate-600 dark:text-slate-400">The blessed beginnings, upbringing, and youth of the final Messenger (PBUH)</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-16">
        <div id="childhood-container" class="space-y-6">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script>
        const childhoodPhases = [
            {
                id: 1,
                badge: "Milestone",
                title: "Birth in the Year of the Elephant",
                subtitle: "The Sign of Amul Fil",
                desc: "The Prophet Muhammad (PBUH) was born in Makkah on Monday, 12th of Rabi' al-Awwal in the Year of the Elephant. His father, Abdullah, passed away before his birth, leaving him under the care of his mother Amina and grandfather Abdul Muttalib.",
                extraDesc: "His birth heralded a profound spiritual awakening for humanity, occurring shortly after Allah protected the Sacred Kaaba from the invading army of Abraha.",
                image: "https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 2,
                badge: "Upbringing",
                title: "Upbringing in the Desert with Banu Sa'd",
                subtitle: "Halimah as-Sa'diyyah and Divine Blessings",
                desc: "In accordance with the custom of noble Meccan families, he was sent to the desert to be nursed by Halimah as-Sa'diyyah. Her household experienced immense blessings, abundant milk, and flourishing livestock throughout his stay.",
                extraDesc: "This pure desert upbringing provided him with eloquence in the Arabic language, robust physical health, and protection from the bustling environment of the city.",
               /* image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80"*/
            },
            {
                id: 3,
                badge: "Purification",
                title: "The Cleaving of the Chest (Shaqq al-Sadr)",
                subtitle: "Purification by Angel Jibreel",
                desc: "During his stay with Banu Sa'd, a miraculous event occurred when Angel Jibreel descended, gently opened his chest, and washed his heart with Zamzam water to remove any trace of worldly impurity.",
                extraDesc: "This divine purification prepared his heart physically and spiritually for receiving the ultimate revelation of the Quran later in life."
            },
            {
                id: 4,
                badge: "Trial",
                title: "Orphanhood and Early Hardships",
                subtitle: "The Loss of Mother and Grandfather",
                desc: "At the age of six, while returning from a visit to Madinah with his mother Amina, she fell ill and passed away at Al-Abwa. Shortly after, his loving grandfather Abdul Muttalib passed away.",
                extraDesc: "Following these trials, his compassionate uncle Abu Talib took him under his protective guardianship, raising him alongside his own children with deep affection."
            },
            {
                id: 5,
                badge: "Character",
                title: "Youth and the Title of Al-Amin",
                subtitle: "The Trustworthy Trader",
                desc: "Growing into early adulthood, Prophet Muhammad (PBUH) distinguished himself through exceptional character, honesty, and integrity, earning universal respect from the tribes of Quraysh.",
                extraDesc: "Even before prophethood, the people of Makkah collectively nicknamed him 'Al-Amin' (The Trustworthy), frequently entrusting their most valuable belongings to his care."
               /* image: "https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=800&q=80"*/
            }
        ];

        document.getElementById('childhood-container').innerHTML = childhoodPhases.map(p => `
            <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                ${p.image ? `
                <div class="h-48 sm:h-52 overflow-hidden relative">
                    <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover">
                    <div class="absolute top-4 left-4 bg-amber-600 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow-md">
                        ${p.badge}
                    </div>
                </div>
                ` : ''}
                <div class="p-6 sm:p-8 space-y-4">
                    <div class="border-b border-slate-100 dark:border-slate-800 pb-4">
                        ${!p.image ? `<span class="inline-block text-xs font-semibold px-2.5 py-1 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 rounded-full mb-2">${p.badge}</span>` : ''}
                        <h2 class="text-xl sm:text-2xl font-bold mt-1">${p.title}</h2>
                        <p class="text-xs sm:text-sm font-medium text-amber-600 dark:text-amber-400 mt-1">${p.subtitle}</p>
                    </div>
                    <div class="space-y-3 text-slate-600 dark:text-slate-300 text-sm leading-relaxed">
                        <p>${p.desc}</p>
                        <p>${p.extraDesc}</p>
                    </div>
                </div>
            </article>
        `).join('');
    </script>
